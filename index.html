<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>At Sea</title>
<meta name="description" content="At Sea — a stylized low-poly sailboat on an endless ocean.">
<style>
:root{
  --ink:#f6ecd9;
  --ink-dim:rgba(246,236,217,.62);
  --ink-faint:rgba(246,236,217,.34);
  --panel:rgba(9,17,29,.56);
  --panel-hi:rgba(22,36,54,.66);
  --edge:rgba(246,236,217,.14);
  --edge-hi:rgba(246,236,217,.32);
  --gold:#e9b866;
  --gold-deep:#b9853a;
  --sea:#7cc6d9;
  --shadow:0 18px 50px rgba(0,6,14,.45), 0 2px 8px rgba(0,6,14,.35);
  --serif: "Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --sans: "Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0a1521;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none;cursor:grab}
canvas#c:active{cursor:grabbing}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 120% 90% at 50% 42%,transparent 58%,rgba(2,8,16,.55) 100%)}
.grain{position:fixed;inset:-50%;pointer-events:none;opacity:.05;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.panel{background:linear-gradient(180deg,var(--panel-hi),var(--panel));border:1px solid var(--edge);border-radius:18px;box-shadow:var(--shadow);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2)}

/* ---------- Title card ---------- */
#title{position:fixed;left:24px;top:24px;width:300px;padding:22px 24px 18px;pointer-events:none;transform-origin:top left}
#title .eyebrow{font-size:10.5px;letter-spacing:.42em;text-transform:uppercase;color:var(--gold);opacity:.9;font-weight:600}
#title h1{font-family:var(--serif);font-weight:500;font-size:58px;line-height:.95;letter-spacing:.06em;margin:8px 0 4px;
  background:linear-gradient(180deg,#fff8ea 10%,#ecd3a4 70%,#c99a55 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 14px rgba(233,184,102,.18))}
#title .tagline{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--ink-dim)}
#title .rule{display:flex;align-items:center;gap:10px;margin:14px 0 12px;color:var(--gold);font-size:12px}
#title .rule span{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--edge-hi),transparent)}
#title .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
#title .stats div{display:flex;flex-direction:column;gap:2px;min-width:0}
#title label{font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
#title b{font-weight:600;font-size:13.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .4s}
#title b.flash{color:var(--gold)}

/* ---------- Ship's log ---------- */
#log{position:fixed;right:24px;top:24px;width:268px;padding:14px 16px;pointer-events:none;display:flex;flex-direction:column;gap:12px}
#log .head{display:flex;justify-content:space-between;align-items:center;font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);font-weight:700}
#log .head i{font-style:normal;color:var(--ink-faint);letter-spacing:.12em}
.logrow{display:flex;gap:11px;align-items:flex-start}
.logrow .av{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(246,236,217,.08);border:1px solid var(--edge)}
.logrow .av svg{width:17px;height:17px}
.logrow label{display:block;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin-bottom:2px}
.logrow p{font-family:var(--serif);font-size:14.5px;line-height:1.25;color:var(--ink);transition:opacity .35s}
.logrow p.fade{opacity:0}

#sound{position:fixed;right:24px;top:auto;bottom:118px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink);pointer-events:auto}
#sound svg{width:18px;height:18px}
#sound:hover{border-color:var(--edge-hi)}
#sound .off{display:none}
#sound.muted .on{display:none}
#sound.muted .off{display:block}

/* ---------- Bottom bar ---------- */
#bar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:10px;padding:10px;border-radius:22px}
.btn{position:relative;display:flex;align-items:center;gap:12px;min-width:176px;padding:12px 16px 12px 13px;border-radius:14px;border:1px solid var(--edge);
  background:linear-gradient(180deg,rgba(246,236,217,.08),rgba(246,236,217,.02));color:var(--ink);cursor:pointer;text-align:left;font:inherit;
  transition:transform .18s cubic-bezier(.2,.8,.2,1),background .25s,border-color .25s,box-shadow .25s}
.btn:hover{transform:translateY(-2px);border-color:var(--edge-hi);background:linear-gradient(180deg,rgba(246,236,217,.14),rgba(246,236,217,.04));box-shadow:0 10px 26px rgba(0,0,0,.3)}
.btn:active,.btn.pressed{transform:translateY(1px) scale(.98)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn.on{border-color:rgba(233,184,102,.55);background:linear-gradient(180deg,rgba(233,184,102,.2),rgba(233,184,102,.05))}
.btn .ic{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(246,236,217,.08);color:var(--gold)}
.btn .ic svg{width:21px;height:21px}
.btn .tx{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.btn .lbl{font-size:14px;font-weight:650;letter-spacing:.02em;white-space:nowrap}
.btn .sub{font-size:11.5px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.btn kbd{flex:none;font:600 11px/1 var(--sans);color:var(--ink-dim);padding:5px 7px;border-radius:6px;border:1px solid var(--edge-hi);border-bottom-width:2px;background:rgba(0,0,0,.18)}
.btn .pips{position:absolute;left:64px;right:16px;bottom:6px;display:flex;gap:3px}
.btn .pips i{flex:1;height:2px;border-radius:2px;background:rgba(246,236,217,.14);transition:background .3s}
.btn .pips i.lit{background:var(--gold)}

/* ---------- Toasts ---------- */
#toasts{position:fixed;left:50%;top:26px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:5}
.toast{display:flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;font-family:var(--serif);font-size:15px;color:var(--ink);
  background:rgba(9,17,29,.72);border:1px solid var(--edge);box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  animation:tin .5s cubic-bezier(.2,.9,.25,1.2) both}
.toast b{color:var(--gold);font-weight:600}
.toast.out{animation:tout .5s ease forwards}
@keyframes tin{from{opacity:0;transform:translateY(-12px) scale(.96)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}

/* ---------- Explode labels ---------- */
#tags{position:fixed;inset:0;pointer-events:none}
.tag{position:absolute;left:0;top:0;display:flex;align-items:center;gap:8px;white-space:nowrap;opacity:0;will-change:transform,opacity}
.tag i{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px rgba(233,184,102,.25),0 0 14px rgba(233,184,102,.6)}
.tag .ln{width:34px;height:1px;background:linear-gradient(90deg,var(--gold),rgba(233,184,102,.2))}
.tag .card{padding:6px 11px 7px;border-radius:10px;background:rgba(9,17,29,.74);border:1px solid rgba(233,184,102,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.tag .card span{display:block;font-family:var(--serif);font-size:14px;color:var(--ink)}
.tag .card em{display:block;font-style:normal;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-top:1px}

#hint{position:fixed;left:24px;bottom:30px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);pointer-events:none;line-height:1.9}
#hint b{color:var(--ink-dim);font-weight:600}

/* ---------- Intro ---------- */
#intro{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#16314a,#060d16 70%);z-index:20;transition:opacity 1.6s ease,visibility 1.6s}
#intro.gone{opacity:0;visibility:hidden}
#intro .in{text-align:center}
#intro h2{font-family:var(--serif);font-weight:500;font-size:clamp(48px,9vw,96px);letter-spacing:.14em;color:#f3e3c4;animation:breathe 2.4s ease-in-out infinite}
#intro p{margin-top:10px;font-size:11px;letter-spacing:.5em;text-transform:uppercase;color:var(--ink-dim)}
#intro .bar{width:160px;height:2px;margin:22px auto 0;background:rgba(246,236,217,.12);border-radius:2px;overflow:hidden}
#intro .bar span{display:block;height:100%;width:40%;background:var(--gold);animation:load 1.2s ease-in-out infinite}
#intro.err p{color:#f3a08a;letter-spacing:.12em;text-transform:none;font-size:14px}
@keyframes breathe{50%{opacity:.75}}
@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(250%)}}

@media (max-width:1100px){
  .btn{min-width:0}
  .btn .sub{max-width:80px}
  #hint{display:none}
}
@media (max-width:820px){
  #title{transform:scale(.78)}
  #log{transform:scale(.8);transform-origin:top right}
  #bar{width:calc(100% - 20px);bottom:10px;gap:6px;padding:7px}
  .btn{flex:1;flex-direction:column;gap:5px;padding:9px 4px 12px;text-align:center}
  .btn .tx{align-items:center}
  .btn .ic{width:32px;height:32px}
  .btn .sub,.btn kbd{display:none}
  .btn .lbl{font-size:12px}
  .btn .pips{left:12px;right:12px}
  #sound{bottom:100px;right:14px}
}
@media (max-width:560px){
  #log{display:none}
  #title{transform:scale(.7)}
}
@media (prefers-reduced-motion:reduce){
  .toast,#intro h2,#intro .bar span{animation:none}
}
</style>

<body>
<canvas id="c" tabindex="0" aria-label="3D view of a sailboat at sea"></canvas>
<div class="vignette"></div>
<div class="grain"></div>
<div id="tags"></div>

<header id="title" class="panel">
  <div class="eyebrow">A Voyage Without End</div>
  <h1>At Sea</h1>
  <div class="tagline">One captain, one husky, and the open horizon.</div>
  <div class="rule"><span></span>&#9875;<span></span></div>
  <div class="stats">
    <div><label>Day</label><b id="sDay">1 &middot; Morning</b></div>
    <div><label>Weather</label><b id="sWeather">Clear Skies</b></div>
    <div><label>Wind</label><b id="sWind">8 kn</b></div>
    <div><label>Sea State</label><b id="sSea">Calm</b></div>
    <div><label>Logged</label><b id="sDist">0.0 nm</b></div>
    <div><label>Catch</label><b id="sFish">0 fish</b></div>
  </div>
</header>

<aside id="log" class="panel">
  <div class="head">Ship's Log <i id="logTime">—</i></div>
  <div class="logrow">
    <div class="av"><svg viewBox="0 0 24 24" fill="none" stroke="#e9b866" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10h14l-1.5-3h-11z"/><path d="M8 10v1a4 4 0 0 0 8 0v-1"/><path d="M6 21c0-3.3 2.7-6 6-6s6 2.7 6 6"/></svg></div>
    <div><label>The Captain</label><p id="capTask">Taking the helm</p></div>
  </div>
  <div class="logrow">
    <div class="av"><svg viewBox="0 0 24 24" fill="none" stroke="#7cc6d9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4l3 5M19 4l-3 5"/><path d="M6 9.5C6 6.5 8.7 5 12 5s6 1.5 6 4.5V14c0 3-2.7 6-6 6s-6-3-6-6z"/><circle cx="9.5" cy="12" r=".6" fill="#7cc6d9"/><circle cx="14.5" cy="12" r=".6" fill="#7cc6d9"/><path d="M11 16h2l-1 1z"/></svg></div>
    <div><label>Koda &middot; Husky</label><p id="dogTask">Watching the waves</p></div>
  </div>
</aside>

<button id="sound" class="panel" title="Toggle sound (M)" aria-label="Toggle sound">
  <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
  <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
</button>

<div id="toasts" aria-live="polite"></div>

<div id="hint"><b>Drag</b> to orbit &nbsp;&middot;&nbsp; <b>Scroll</b> to zoom<br><b>D W F E</b> shortcuts &nbsp;&middot;&nbsp; <b>M</b> sound</div>

<nav id="bar" class="panel" aria-label="Controls">
  <button class="btn" id="bDay" aria-keyshortcuts="D">
    <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4"/><path d="M15.5 8.5A5 5 0 1 0 15.5 15.5 4 4 0 0 1 15.5 8.5z" fill="currentColor" fill-opacity=".25"/></svg></span>
    <span class="tx"><span class="lbl">Day / Night</span><span class="sub" id="subDay">Daytime</span></span>
    <kbd>D</kbd>
  </button>
  <button class="btn" id="bWeather" aria-keyshortcuts="W">
    <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15a4 4 0 0 1-.5-7.97A5.5 5.5 0 0 1 17 7.5a3.75 3.75 0 0 1 .5 7.5z"/><path d="M8 18l-1 2.5M12 18l-1 2.5M16 18l-1 2.5"/></svg></span>
    <span class="tx"><span class="lbl">Weather</span><span class="sub" id="subWeather">Clear Skies</span></span>
    <kbd>W</kbd>
    <span class="pips" id="pips"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
  </button>
  <button class="btn" id="bFish" aria-keyshortcuts="F">
    <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12c2.5-3.5 6-5 9.5-5 3 0 5.5 1.6 7.5 5-2 3.4-4.5 5-7.5 5C9 17 5.5 15.5 3 12z"/><path d="M3 12l-1.5-3M3 12l-1.5 3"/><circle cx="16" cy="11" r=".8" fill="currentColor"/></svg></span>
    <span class="tx"><span class="lbl">Fish</span><span class="sub" id="subFish">Cast a line</span></span>
    <kbd>F</kbd>
  </button>
  <button class="btn" id="bExplode" aria-keyshortcuts="E">
    <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4-8 4-8-4z"/><path d="M4 12l8 4 8-4" opacity=".75"/><path d="M4 17l8 4 8-4" opacity=".5"/></svg></span>
    <span class="tx"><span class="lbl">Explode</span><span class="sub" id="subExplode">Assembled</span></span>
    <kbd>E</kbd>
  </button>
</nav>

<div id="intro"><div class="in"><h2>AT SEA</h2><p>Hoisting the sails</p><div class="bar"><span></span></div></div></div>

<script>
  // Surface module-load failures (e.g. offline CDN) instead of a silent blank screen.
  window.addEventListener('error', e => {
    const i = document.getElementById('intro');
    if (i && !i.classList.contains('gone')) { i.classList.add('err'); i.querySelector('p').textContent = 'Could not load three.js — check your connection and refresh.'; }
  });
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
   Utilities
   ===================================================================== */
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const dampAng = (a, b, k, dt) => a + angDiff(a, b) * (1 - Math.exp(-k * dt));
const C = c => new THREE.Color(c);
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const _v1 = V3(), _v2 = V3(), _v3 = V3();

/* =====================================================================
   Renderer / scene / camera
   ===================================================================== */
const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xbfd9ea, 0.004);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 4000);
camera.position.set(13.5, 8.2, 14.5);

const clock = new THREE.Clock();
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.4, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 6.5;
controls.maxDistance = 70;
controls.minPolarAngle = 0.18;
controls.maxPolarAngle = Math.PI * 0.495;
controls.enablePan = false;
controls.rotateSpeed = 0.7;
controls.zoomSpeed = 0.9;
controls.autoRotateSpeed = 0.32;
let lastInteract = -100, interacting = false;
controls.addEventListener('start', () => { interacting = true; lastInteract = clock.elapsedTime; controls.autoRotate = false; });
controls.addEventListener('end', () => { interacting = false; lastInteract = clock.elapsedTime; });
renderer.domElement.addEventListener('wheel', () => { lastInteract = clock.elapsedTime; controls.autoRotate = false; }, { passive: true });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  particleUniforms.uScale.value = renderer.getPixelRatio() * innerHeight * 0.5;
});

/* =====================================================================
   World state
   ===================================================================== */
const WEATHER = [
  { name: 'Clear Skies',      cover: 0.0,  dark: 0.0,  rain: 0,    waves: 0.32, wind: 8,  bolt: 0,    fog: 0.0032, sea: 'Calm' },
  { name: 'Partly Cloudy',    cover: 0.4,  dark: 0.06, rain: 0,    waves: 0.48, wind: 12, bolt: 0,    fog: 0.0042, sea: 'Slight' },
  { name: 'Full Clouds',      cover: 0.88, dark: 0.3,  rain: 0,    waves: 0.68, wind: 16, bolt: 0,    fog: 0.0062, sea: 'Moderate' },
  { name: 'Dark Rain Clouds', cover: 1,    dark: 0.62, rain: 0.05, waves: 0.88, wind: 21, bolt: 0,    fog: 0.0090, sea: 'Rough' },
  { name: 'Raining',          cover: 1,    dark: 0.74, rain: 0.55, waves: 1.05, wind: 25, bolt: 0,    fog: 0.0125, sea: 'Rough' },
  { name: 'Storming',         cover: 1,    dark: 0.88, rain: 0.85, waves: 1.38, wind: 34, bolt: 0.22, fog: 0.0160, sea: 'Very Rough' },
  { name: 'Heavy Storm',      cover: 1,    dark: 1,    rain: 1,    waves: 1.75, wind: 46, bolt: 0.55, fog: 0.0205, sea: 'High' },
];
const world = {
  weatherIdx: 0, lastWeatherPress: -1e9, nextAutoWeather: 95,
  w: { ...WEATHER[0] },          // smoothed live weather values
  dayTarget: 1, day: 1, dayFrom: 1, dayAnimT: 1, dayNum: 1,
  isNight: false,
  offset: 0, speed: 2.5, distance: 0,
  waveAmp: 0.32, steep: 0.35,
  fishCount: 0,
  explode: false, explodeT: 0,
  flash: 0,
  time: 0,
};
const night = () => 1 - world.day;

/* =====================================================================
   Sky dome, sun, moon, stars
   ===================================================================== */
const skyU = {

// Bake static parts into one mesh per material so the boat renders in a handful of draw calls.
function mergeStatic(group) {
  const buckets = new Map();
  for (const c of [...group.children]) {
    if (!c.isMesh || c.userData.keep) continue;
    c.updateMatrix();
    const g = c.geometry.index ? c.geometry.toNonIndexed() : c.geometry.clone();
    g.applyMatrix4(c.matrix);
    const keepUV = !!c.material.map;
    for (const k of Object.keys(g.attributes)) if (!(k === 'position' || k === 'normal' || k === 'color' || (k === 'uv' && keepUV))) g.deleteAttribute(k);
    if (!g.attributes.normal) g.computeVertexNormals();
    const key = c.material.uuid + '|' + Object.keys(g.attributes).sort().join(',') + '|' + c.castShadow + c.receiveShadow;
    if (!buckets.has(key)) buckets.set(key, { mat: c.material, geos: [], cs: c.castShadow, rs: c.receiveShadow });
    buckets.get(key).geos.push(g);
    group.remove(c);
  }
  for (const b of buckets.values()) {
    const m = new THREE.Mesh(b.geos.length > 1 ? mergeGeometries(b.geos) : b.geos[0], b.mat);
    m.castShadow = b.cs; m.receiveShadow = b.rs; group.add(m);
  }
}

}

/* =====================================================================
   Characters — jointed low-poly rigs
   ===================================================================== */
class Rig {
  constructor() { this.j = {}; this.tgt = {}; this.ptgt = {}; }
  add(name, obj) { this.j[name] = obj; return obj; }
  r(name, x = 0, y = 0, z = 0) { this.tgt[name] = [x, y, z]; }
  p(name, x, y, z) { this.ptgt[name] = [x, y, z]; }
  apply(dt, k = 9) {
    for (const n in this.j) {
      const o = this.j[n], t = this.tgt[n], p = this.ptgt[n];
      const b = o.userData.base || (o.userData.base = o.position.clone());
      o.rotation.x = damp(o.rotation.x, t ? t[0] : 0, k, dt);
      o.rotation.y = damp(o.rotation.y, t ? t[1] : 0, k, dt);
      o.rotation.z = damp(o.rotation.z, t ? t[2] : 0, k, dt);
      o.position.x = damp(o.position.x, p ? p[0] : b.x, k, dt);
      o.position.y = damp(o.position.y, p ? p[1] : b.y, k, dt);
      o.position.z = damp(o.position.z, p ? p[2] : b.z, k, dt);
    }
    this.tgt = {}; this.ptgt = {};
  }
}
function limb(rig, name, parent, x, y, z, segs) {
  const j = rig.add(name, new THREE.Group()); j.position.set(x, y, z); parent.add(j);
  return j;
}

function poseCaptain(c, t, dt) {
  const R = c.rig, mv = c.moving, s = Math.sin(c.walkPh);

  R.r('elbowL', -0.15); R.r('elbowR', -0.15);
  R.r('spine', breathe, 0, sway); R.r('neck', 0, Math.sin(t * 0.37) * 0.25, 0);
  R.r('legL', 0, 0, 0.04 + sway * 0.5); R.r('legR', 0, 0, -0.04 + sway * 0.5);
  let eyes = 1;
  switch (P) {
    case 'helm': {
      const st = Math.sin(t * 0.6) * 0.25 * (0.4 + world.w.waves);
      R.r('armL', -1.05, 0, -0.25 + st * 0.3); R.r('armR', -1.05, 0, 0.25 + st * 0.3);
      R.r('elbowL', -0.55); R.r('elbowR', -0.55);
      R.r('neck', -0.05, Math.sin(t * 0.21) * 0.3, 0);
      gear.wheel.rotation.x = damp(gear.wheel.rotation.x, st * 2.2, 3, dt);
      break;
    }
    case 'lookUp': R.r('neck', -0.62, Math.sin(t * 0.5) * 0.2, 0); R.r('armL', 0, 0, 0.55); R.r('elbowL', -1.9, 0, 0); R.r('armR', 0, 0, -0.55); R.r('elbowR', -1.9); break;
    case 'trim': {
      const a = Math.max(0, Math.sin(t * 3.2)), b = Math.max(0, -Math.sin(t * 3.2));
      R.r('armL', -2.75 + a * 0.75, 0, -0.1); R.r('armR', -2.75 + b * 0.75, 0, 0.1);
      R.r('elbowL', -0.25 - a * 0.4); R.r('elbowR', -0.25 - b * 0.4);
      R.r('neck', -0.5, 0, 0); R.r('spine', -0.08 + (a + b) * 0.06, 0, sway);
      break;
    }
    case 'lean': R.r('spine', 0.38, 0, sway); R.r('neck', 0.28, 0, 0); R.r('armR', -0.7, 0, 0.1); R.r('elbowR', -0.3); R.r('armL', 0, 0, 0.4); R.r('elbowL', -1.6); break;
    case 'reach': R.r('spine', 0.25, 0, 0); R.r('armR', -1.7, 0, 0.1); R.r('elbowR', -0.2); break;
    case 'holdRod': case 'reel': case 'liftFish': case 'castBack': case 'castFwd': {
      let ax = -0.7, ex = -0.7, sp = 0.05;
      if (P === 'castBack') { ax = -2.4; ex = -0.9; sp = -0.18; }
      if (P === 'castFwd') { ax = -1.05; ex = -0.15; sp = 0.22; }
      if (P === 'liftFish') { ax = -1.9; ex = -0.6; sp = -0.12; }
      R.r('armR', ax, 0, 0.12); R.r('elbowR', ex);
      if (P === 'reel') { R.r('armL', -0.85 + Math.sin(t * 13) * 0.18, 0, -0.35); R.r('elbowL', -1.05 + Math.cos(t * 13) * 0.25); }
      else { R.r('armL', -0.85, 0, -0.38); R.r('elbowL', -1.0); }
      R.r('spine', sp, 0, sway); R.r('neck', P === 'liftFish' ? -0.35 : 0.08, 0, 0);
      break;
    }
    case 'carry': R.r('armL', -1.0, 0, -0.1); R.r('elbowL', -0.9); R.r('neck', 0.25, 0, 0); break;
    case 'crouch': case 'pet': {

      R.r('legL', -1.05, 0, 0.08); R.r('legR', -1.05, 0, -0.08); R.r('kneeL', 1.75); R.r('kneeR', 1.75);
      R.r('spine', 0.42, 0, 0); R.r('neck', 0.2, 0, 0);
      if (P === 'pet') { R.r('armR', -0.95 + Math.sin(t * 5) * 0.18, 0, 0.12); R.r('elbowR', -0.25 + Math.sin(t * 5) * 0.15); R.r('armL', -0.3, 0, 0.2); R.r('elbowL', -0.5); }
      else { R.r('armR', -0.8, 0, 0.1); R.r('elbowR', -0.3); R.r('armL', -0.9, 0, -0.1); R.r('elbowL', -0.4); }

    }
    case 'spyglass': {

      R.r('armL', -0.95, 0, -0.55); R.r('elbowL', -1.25);
      R.r('spine', -0.04, Math.sin(t * 0.45) * 0.55, 0); R.r('neck', -0.06, 0, 0);

    }
    case 'cheer': { const w = Math.sin(t * 9) * 0.25; R.r('armL', -2.9, 0, -0.2 + w); R.r('armR', -2.9, 0, 0.2 - w); R.r('elbowL', -0.2); R.r('elbowR', -0.2); R.r('neck', -0.3, 0, 0); break; }
    case 'shrug': R.r('armL', -0.2, 0, 0.5); R.r('armR', -0.2, 0, -0.5); R.r('elbowL', -1.4); R.r('elbowR', -1.4); R.r('spine', 0.1, 0, 0); R.r('neck', 0.25, 0, 0.18); break;
    case 'stretch': R.r('armL', -3.0, 0, -0.35); R.r('armR', -3.0, 0, 0.35); R.r('elbowL', -0.1); R.r('elbowR', -0.1); R.r('spine', -0.2, 0, 0); R.r('neck', -0.45, 0, 0); break;
    case 'sleep': case 'sit': {
      R.p('hips', 0, 0.14, 0.05);
      R.r('legL', -1.45, 0, 0.1); R.r('legR', -1.42, 0, -0.1); R.r('kneeL', 0.15); R.r('kneeR', 0.25);
      R.r('spine', -0.3, 0, 0); R.r('armL', -0.45, 0, -0.1); R.r('armR', -0.45, 0, 0.1); R.r('elbowL', -1.0); R.r('elbowR', -1.0);
      if (P === 'sleep') { R.r('neck', 0.42 + Math.sin(t * 0.9) * 0.03, 0, 0.25); eyes = 0.15; } else R.r('neck', 0.05, 0, 0);
      break;
    }
  }

  if (mv > 0.02) {
    const k = mv;
    R.r('legL', s * 0.55 * k, 0, 0.03); R.r('legR', -s * 0.55 * k, 0, -0.03);
    R.r('kneeL', Math.max(0, -s) * 0.7 * k); R.r('kneeR', Math.max(0, s) * 0.7 * k);
    if (P !== 'carry' && !gear.rods.some(r => r.inHand)) { R.r('armL', -s * 0.45 * k, 0, 0.1); R.r('armR', s * 0.45 * k, 0, -0.1); }

}

/* =====================================================================
   Behaviour — coroutine tasks
   ===================================================================== */
let DT = 0.016;
function* wait(sec) { let t = 0; while (t < sec) { t += DT; yield; } }
function* waitUntil(fn, max = 1e9) { let t = 0; while (!fn() && t < max) { t += DT; yield; } }
const CAB = { x0: -1.92, x1: 0.74, z: 0.98 };
function insideCabin(x, z) { return x > CAB.x0 && x < CAB.x1 && Math.abs(z) < CAB.z; }
function clampDeck(x, z) { x = clamp(x, -3.65, 3.6); const h = Math.max(0.15, deckHalf(x) - 0.22); return [x, clamp(z, -h, h)]; }
function planPath(ax, az, bx, bz) {
  const pts = [];
  let hit = false;
  for (let i = 1; i < 16; i++) { const f = i / 16; if (insideCabin(lerp(ax, bx, f), lerp(az, bz, f))) { hit = true; break; } }
  if (hit) {
    const sd = (az + bz) === 0 ? (Math.random() < 0.5 ? -1 : 1) : Math.sign(az + bz);
    const zz = sd * 1.04;
    pts.push([clamp(ax, CAB.x0, CAB.x1), zz], [clamp(bx, CAB.x0, CAB.x1), zz]);
  }
  pts.push([bx, bz]);
  // swing around the mast
  const out = []; let px = ax, pz = az;
  for (const p of pts) {
    const dx = p[0] - px, dz = p[1] - pz, L2 = dx * dx + dz * dz || 1;
    const f = clamp(((MAST_X - px) * dx + (0 - pz) * dz) / L2, 0, 1);
    const cx = px + dx * f, cz = pz + dz * f;
    if (Math.hypot(cx - MAST_X, cz) < 0.32 && f > 0.05 && f < 0.95) out.push([MAST_X, (cz >= 0 ? 1 : -1) * 0.5]);
    out.push(p); px = p[0]; pz = p[1];
  }
  return out.map(p => clampDeck(p[0], p[1]));
}
function* walkTo(c, x, z, speedMul = 1) {
  [x, z] = clampDeck(x, z);
  for (const [px, pz] of planPath(c.pos.x, c.pos.y, x, z)) {
    for (;;) {
      const dx = px - c.pos.x, dz = pz - c.pos.y, d = Math.hypot(dx, dz);
      if (d < 0.03) break;
      c.targetHeading = Math.atan2(dx, dz);
      const err = Math.abs(angDiff(c.heading, c.targetHeading));
      const sp = c.speed * speedMul * (err > 1.1 ? 0.12 : 1) * (1 - Math.min(world.w.waves, 1.8) * 0.12);
      const st = Math.min(d, sp * DT);
      c.pos.x += dx / d * st; c.pos.y += dz / d * st;
      c.walking = true; c.walkSpd = speedMul;
      yield;
    }
  }
}
function* face(c, h, maxT = 0.9) { c.targetHeading = h; yield* waitUntil(() => Math.abs(angDiff(c.heading, h)) < 0.08, maxT); }
function* faceTo(c, x, z, maxT) { yield* face(c, Math.atan2(x - c.pos.x, z - c.pos.y), maxT); }
function updateMover(c, dt, turnK = 6) {
  c.heading = dampAng(c.heading, c.targetHeading, turnK, dt);
  c.moving = damp(c.moving, c.walking ? 1 : 0, 9, dt);
  c.walkPh += dt * c.speed * (c.walkSpd || 1) * 7.5 * c.moving;
  c.walking = false;
  c.root.position.set(c.pos.x, deckY(c.pos.x), c.pos.y);
  c.root.rotation.y = c.heading;
}
function runTask(c, dt) {
  if (c.task) { const r = c.task.next(); if (r.done) c.task = null; }
  if (!c.task) c.task = c.next();
}
function interrupt(c) {
  if (c.task) { const t = c.task; c.task = null; t.return(); }
  c.pose = c === dog ? 'stand' : 'idle'; c.sleeping = false;
}

  el.className = 'toast'; el.innerHTML = html; box.appendChild(el);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 520); }, 3400);
}
function flashStat(id) { const el = $(id); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1000); }
const pips = [...$('pips').children];
let hudAcc = 1;
function setText(id, v) { const el = $(id); if (el.textContent !== v) el.textContent = v; }
function updateHUD(dt) {
  hudAcc += dt; if (hudAcc < 0.2) return; hudAcc = 0;
  const W = WEATHER[world.weatherIdx], w = world.w, d = world.day;
  const tod = world.dayTarget ? (d < 0.95 ? 'Dawn' : 'Morning') : (d > 0.05 ? 'Dusk' : 'Night');
  setText('sDay', `${world.dayNum} · ${tod}`);
  setText('sWeather', W.name);
  setText('sWind', `${Math.round(w.wind)} kn`);
  const sea = w.waves < 0.4 ? 'Calm' : w.waves < 0.6 ? 'Slight' : w.waves < 0.8 ? 'Moderate' : w.waves < 1.2 ? 'Rough' : w.waves < 1.6 ? 'Very Rough' : 'High';
  setText('sSea', sea);
  setText('sDist', `${(world.offset / 60).toFixed(1)} nm`);
  setText('sFish', `${world.fishCount} fish`);
  setText('logTime', `${world.isNight ? 'Night' : 'Day'} ${world.dayNum}`);
  setText('subDay', world.isNight ? 'Nighttime' : 'Daytime');
  setText('subWeather', W.name);
  setText('subFish', cap.fishing ? 'Line in the water…' : 'Cast a line · 20%');
  setText('subExplode', world.explode ? 'Exploded view' : 'Assembled');
  pips.forEach((p, i) => p.classList.toggle('lit', i <= world.weatherIdx));
  $('bDay').classList.toggle('on', world.isNight);
  $('bFish').classList.toggle('on', !!cap.fishing);
  $('bExplode').classList.toggle('on', world.explode);
}

/* =====================================================================
   Input
   ===================================================================== */
function toggleDay() {
  world.dayFrom = world.day; world.dayTarget = world.dayTarget ? 0 : 1; world.dayAnimT = 0;
  world.isNight = world.dayTarget === 0;
  if (!world.isNight) world.dayNum++;
  sfx.bell();
  if (!cap.fishing && (world.isNight || !cap.sleeping)) { interrupt(cap); resetProps(); }
  if (world.isNight || !dog.sleeping) interrupt(dog);
  toast(world.isNight ? 'Night falls &mdash; the lanterns are lit' : `Dawn breaks &mdash; <b>Day ${world.dayNum}</b>`);
}
function cycleWeather() { world.lastWeatherPress = world.time; setWeather(world.weatherIdx + 1); }
function toggleExplode() { world.explode = !world.explode; }
function pressFx(id) { const b = $(id); b.classList.add('pressed'); setTimeout(() => b.classList.remove('pressed'), 140); }
const ACTIONS = { d: ['bDay', toggleDay], w: ['bWeather', cycleWeather], f: ['bFish', fishButton], e: ['bExplode', toggleExplode] };
for (const k in ACTIONS) $(ACTIONS[k][0]).addEventListener('click', () => { sfx.init(); ACTIONS[k][1](); });
function toggleSound() { sfx.init(); const on = sfx.toggle(); $('sound').classList.toggle('muted', !on); toast(on ? 'Sound on' : 'Sound off'); }
$('sound').addEventListener('click', toggleSound);
addEventListener('keydown', e => {
  if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (ACTIONS[k]) { sfx.init(); pressFx(ACTIONS[k][0]); ACTIONS[k][1](); e.preventDefault(); }
  else if (k === 'm') toggleSound();
});
addEventListener('pointerdown', () => sfx.init(), { once: false, passive: true });

/* =====================================================================
   Main loop
   ===================================================================== */
let nextCreak = 4, nextGull = 12, started = false;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  world.time += dt; const t = world.time;
  DT = dt;
  updateEnv(dt, t);
  updateLightning(dt);
  updateBoat(dt, t);
  updateSails(dt, t);
  runTask(cap, dt); runTask(dog, dt);
  updateMover(cap, dt, 6); updateMover(dog, dt, 7.5);
  poseCaptain(cap, t, dt); poseDog(dog, t, dt);
  updateExplode(dt, t);
  boat.updateMatrixWorld(true);
  updateRods(dt, t);
  updateJumpers(dt);
  updateParticles(dt);
  updateRain(dt);
  updateZs(dt);
  // ambience
  sfx.update(t);
  if (t > nextCreak) { nextCreak = t + rand(4, 11) / (0.6 + world.w.waves); sfx.creak(0.4 + world.w.waves * 0.6); }
  if (t > nextGull) { nextGull = t + rand(14, 30); if (world.day > 0.8 && world.weatherIdx <= 1) sfx.gull(); }
  // camera
  if (!interacting && t - lastInteract > 6) controls.autoRotate = true;
  controls.target.y = damp(controls.target.y, lerp(2.4, 5.6, world.explodeT) + bs.heave * 0.5, 2, dt);
  if (world.explode && !interacting) {
    const dist = camera.position.distanceTo(controls.target);
    if (dist < 25) camera.position.sub(controls.target).multiplyScalar(1 + dt * 0.9).add(controls.target);
  }
  controls.update();
  const hc = waveHeight(camera.position.x, camera.position.z) + 1.3;
  if (camera.position.y < hc) camera.position.y = hc;
  updateHUD(dt);
  renderer.render(scene, camera);
  if (!started) { started = true; setTimeout(() => { $('intro').classList.add('gone'); setTimeout(() => toast('Welcome aboard the <b>Wanderer</b>'), 1100); }, 500); }
}
renderer.setAnimationLoop(frame);
window.__atsea = { camera, controls, world, cap, dog, toggleDay, cycleWeather, fishButton, toggleExplode, LAYERS };
</script>
</body>
</html>
